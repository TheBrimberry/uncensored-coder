<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <style>body{width:auto;} .panel{display:block;}</style>
</head>
<body data-theme="dark">
  <header>
    <span class="logo">📈</span>
    <div class="hwrap">
      <div class="title">Live Signals</div>
      <div class="sub">auto-refreshing</div>
    </div>
    <button id="refresh" class="icon" title="Refresh">↻</button>
  </header>
  <section class="panel active">
    <div class="rowbar">
      <span class="muted">Watchlist · 1d</span>
      <span id="clock" class="muted"></span>
    </div>
    <div id="cards" class="cards" style="max-height:none;">Loading…</div>
  </section>
  <div id="status" class="status">● checking agent…</div>
  <script src="common.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
